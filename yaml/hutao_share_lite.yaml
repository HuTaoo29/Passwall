proxy-groups:
  - {name: "♻️🇺🇸 美国自动", type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|🇺🇸|(?i)US|(?i)States|(?i)America))^((?!(新加坡|🇸🇬|坡|狮城|(?i)SG|(?i)Singapore)).)*$"}
  - {name: "♻️🇸🇬 狮城自动", type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(新加坡|🇸🇬|坡|狮城|(?i)SG|(?i)Singapore))^((?!(美|🇺🇸|(?i)US|(?i)States|(?i)America)).)*$"}

  - {name: "📹 YouTube", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}
  - {name: "🍀 Google", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}
  - {name: "֍ OpenAI", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}
  - {name: "👨🏿‍💻 GitHub", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}
  - {name: "🐬 OneDrive", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}
  - {name: "🪟 Microsoft", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动"]}

  - {name: "🐟 漏网之鱼", type: select, proxies: ["♻️🇺🇸 美国自动", "♻️🇸🇬 狮城自动", DIRECT]}


