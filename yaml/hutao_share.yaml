  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?=.*(港|🇭🇰|(?i)HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日|🇯🇵|(?i)JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(新加坡|🇸🇬|坡|狮城|(?i)SG|(?i)Singapore))^((?!(港|台|韩|日|美)).)*$"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?=.*(美|🇺🇸|(?i)US|(?i)States|(?i)America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️🇭🇰 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|🇭🇰|(?i)HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️🇯🇵 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|🇯🇵|(?i)JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: ♻️🇸🇬 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(新加坡|🇸🇬|坡|狮城|(?i)SG|(?i)Singapore))^((?!(港|台|韩|日|美)).)*$" }
  - {name: ♻️🇺🇸 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|🇺🇸|(?i)US|(?i)States|(?i)America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️🇹🇼 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(台|🇹🇼|(?i)TW|(?i)Taiwan))^((?!(美|US|States|America|港|日|韩|新)).)*$"}
  - {name: 🌐🇺🇳 全部节点, type: select, include-all: true}

